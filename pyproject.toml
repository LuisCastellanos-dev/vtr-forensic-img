[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vtr-forensic-img"
version = "0.3.0"
description = "Forensic image analysis — binary structure verification, metadata extraction, chain of custody"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Vector Telemetry Research"}]
dependencies = [
    "exifread>=3.0",
    "piexif>=1.1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=9.0",
    "requests>=2.28",
    "pynacl>=1.5",
]

[project.scripts]
vtr-forensic-img = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
packages = ["core"]
